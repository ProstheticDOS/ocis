name: build-and-upload

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: termux/termux-docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        run: |
          pkg upgrade -y
          pkg install golang

      - name: Build arm64-v8a Android
        run: |
          # Setup environment
          LDFLAGS += -X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn -s -w -X "$(OCIS_REPO)/ocis-pkg/version.String=$(STRING)" -X "$(OCIS_REPO)/ocis-pkg/version.Tag=$(VERSION)" -X "$(OCIS_REPO)/ocis-pkg/version.Date=$(DATE)"


          mkdir -p build
          go build \
              -tags 'netgo' \
              -buildmode=pie \
              -trimpath \
              -ldflags '-extldflags "-static" -ldflags=" -X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn -s -w \
              -o './ocis.txt'

      - name: Upload to tmpfiles.org
        run: |
          # Upload and print the response to the log
          curl -F "file=@./ocis.txt" https://tmpfiles.org/api/v1/upload | jq .
