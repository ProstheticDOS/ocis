name: Build Termux

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: termux/termux-docker:aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pkg update
          pkg upgrade -y
          pkg install -y golang clang make pkg-config

      - name: Generate code
        run: |
          make generate

      - name: Build oCIS
        env:
          VERSION: ${{ github.ref_name }}
          STRING: ${{ github.sha }}
        run: |
          export DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Go environment:"
          go version
          go env GOOS GOARCH CGO_ENABLED

          mkdir -p build

          make -C ocis build

          cp ocis/bin/ocis ./build/ocis

      - name: Verify binary
        run: |
          file ./build/ocis
          ls -lh ./build/ocis

      - name: Upload to tmpfiles.org
        run: |
          curl -fsS -F "file=@./build/ocis" \
            https://tmpfiles.org/api/v1/upload | jq .
